name: supportnexus

services:
  backend:
    build:
      context: ./SupportNexus
      dockerfile: Dockerfile
    env_file:
      # 密钥保留在本机 .env 中，不写入 Compose 文件或镜像。
      - ./SupportNexus/.env
    environment:
      # 容器之间通过服务名通信；不使用宿主机的 localhost。
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      # ChromaDB 服务临时不可用时，后端的本地降级数据也能持久化。
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    ports:
      # 仅允许本机访问后端，避免意外暴露到局域网。
      - "127.0.0.1:8000:8000"
    volumes:
      - supportnexus-user-memories:/app/data/user_memories
      - supportnexus-fallback-chroma-data:/app/data/chroma
    networks:
      - supportnexus-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  redis:
    image: redis:7-alpine
    volumes:
      - supportnexus-redis-data:/data
    networks:
      - supportnexus-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - supportnexus-chromadb-data:/chroma/chroma
    networks:
      - supportnexus-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./SupportNexusFrontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 前端通过 Nginx 提供；与本机 Vite 开发端口 5173 区分开。
      - "127.0.0.1:8080:80"
    networks:
      - supportnexus-internal
    healthcheck:
      # 明确使用 IPv4 回环地址，避免 Alpine 中 localhost 优先解析为 ::1，
      # 而 Nginx 仅监听 IPv4 时造成误报。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  supportnexus-internal:
    driver: bridge

volumes:
  supportnexus-redis-data:
  supportnexus-chromadb-data:
  supportnexus-user-memories:
  supportnexus-fallback-chroma-data:
