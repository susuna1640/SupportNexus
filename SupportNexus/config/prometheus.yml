# Prometheus 配置文件 — SupportNexus 智能客服系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'support-nexus'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # SupportNexus 主应用指标
  - job_name: 'support-nexus-app'
    static_configs:
      - targets: ['support-nexus:8000']
        labels:
          service: 'support-nexus'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
